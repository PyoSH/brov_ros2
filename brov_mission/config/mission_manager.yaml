brov_mission_manager:
  ros__parameters:
    pool_frame: pool
    odom_frame: odom
    base_frame: base_link
    # Canonical first-point gate input; pose and alignment ownership are one
    # DDS sample. The standalone pool Odometry is diagnostics only.
    aligned_odometry_topic: /brov/localization/odometry_pool_with_alignment

    # Position-only waypoint contract. Non-identity pose orientations fail
    # closed; changing this flag to true is rejected until orientation guidance
    # has a versioned end-to-end implementation.
    orientation_support_enabled: false
    identity_orientation_tolerance: 0.001

    # Nominal conservative waypoint-centre/segment box for the
    # 4.0 x 1.7 x 1.1 m pool.  A finite measured start may be just outside;
    # max_first_point_distance_m still bounds its entry to waypoint 0.  These
    # are operational inputs, not a certified hull/tether geofence. Re-survey
    # and account for vehicle swept volume before water trials.
    pool_safe_min_xyz: [0.35, 0.30, 0.20]
    pool_safe_max_xyz: [3.65, 1.40, 0.90]
    max_first_point_distance_m: 0.30
    min_segment_length_m: 0.05
    max_segment_length_m: 4.0
    min_waypoints: 2
    max_waypoints: 50

    localization_max_age_s: 1.0
    odometry_max_age_s: 0.5

    cruise_speed: 0.10
    lookahead_dist: 0.40
    reach_threshold: 0.15
    # Defense-in-depth limits are checked both here and by brov_base before
    # a resolved mission can reach guidance.
    max_cruise_speed: 0.30
    max_lookahead_dist: 1.00
    max_reach_threshold: 0.50
    # v1 is deliberately frozen to the deterministic straight/align modes.
    # Sim2Swim random-attitude missions select the separately versioned v2
    # contract in their dedicated configuration.
    contract_version: brov_pool_position_mission_v1
    heading_mode: straight
    loop: false
    # `upright` means yaw=0 in the legacy mission frame, not in pool, so it is
    # excluded from this absolute pool-position contract.
    allowed_heading_modes: [straight, align]

    # These defaults are ignored by v1. Under v2 every value is validated and
    # included in canonical_plan_json/plan_hash; the consumer must enforce the
    # same finite duration/lap and attitude-transition contract.
    random_attitude_seed: 0
    random_attitude_reference_frame: pool_zup_flu
    random_attitude_generator_version: sha256_counter_uniform_rpy_v1
    random_attitude_rpy_min_rad: [-1.5707963267948966, -1.5707963267948966, -3.141592653589793]
    random_attitude_rpy_max_rad: [1.5707963267948966, 1.5707963267948966, 3.141592653589793]
    random_attitude_max_slew_rate_rad_s: 0.35
    random_attitude_tolerance_rad: 0.1745329252
    random_attitude_angular_speed_tolerance_rad_s: 0.0872664626
    random_attitude_dwell_time_s: 2.0
    random_attitude_max_duration_s: 120.0
    random_attitude_max_laps: 1
