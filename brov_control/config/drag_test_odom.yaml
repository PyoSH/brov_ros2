# 실기 surge 항력 측정 — 비전 미사용(odom-상대) 모드
# 수조 3~4m × 폭 2m × 수심 1.15m 기준.
# ros2 launch brov_bringup drag_test.launch.py use_pool_alignment:=false \
#     drag_test_config:=<이 파일의 절대경로>
brov_drag_test:
  ros__parameters:
    # ── 시험 설계 ──
    # level은 tau_max 비율이라 전압에 거의 불변하다. 두 가설(v_max 0.88 / 1.48)
    # 모두에서 u=0.5 m/s를 가운데 두고, 전 수준이 1.8m 주행 안에 들어간다.
    # 최고 0.60은 PWM 비포화 한계(15.4V에서 0.87)에 한참 못 미친다.
    levels: [0.10, 0.20, 0.32, 0.45, 0.60]
    repeat_first_level: true        # 최저 수준을 끝에 한 번 더 — 재순환 편향 검사
    # 단발 운용. prepare→start 한 번에 수준 하나만 재고 스스로 정지·disarm 한 뒤
    # IDLE로 돌아온다. 노드는 계속 살아 있다. 운용자가 기체를 여유 있는 자리로
    # 옮겨 정지시키고 prepare→start 하면 다음 수준이 돈다. 수준을 다 마치면
    # 그때 한 번 저장·보고하고 끝난다.
    #   - 노드가 선회하지 않는다(왕복 끔). 뱃머리는 운용자가 맞춘다.
    #   - 출발점은 항상 '방금 prepare한 자리'라 매 회차 여유 공간이 같다.
    #   - 도중에 stop을 부르면 그 시점까지의 결과로 세션이 마감된다.
    single_level_per_start: true
    voltage: 14.0                   # 시험 직전 실측값으로 바꿀 것 (T200은 전압 의존)
    buoyancy_n: 1.96                # 순중량 200g 음성. 없으면 수준마다 초반에 가라앉는다
    rate_hz: 25.0                   # obs_node의 PWM 워치독이 0.25s — 4Hz 밑으로 가면 fault

    # ── 정상상태 판정 (몬테카를로 400회로 확정) ──
    # 창 1.5s는 가설 B 상위 수준을 30%/0%로 죽인다(거리 한계가 일찍 걸려 tail이
    # 가속구간까지 뒷걸음질). 문턱 0.02는 level 0.60을 49%만 살린다.
    settle_window_s: 1.2
    # 0.03은 실측에서 상승 구간을 정상상태로 잡았다 — level 0.20이 t=3.9에
    # u=0.358로 통과했지만 t=5.2까지 0.396으로 계속 올랐다. 0.015로 내린다.
    # (원래 0.03은 '꼬리 창을 한 번만 본다'는 전제의 몬테카를로 값이다. 이제는
    #  정상상태를 감지하는 즉시 끊으므로 엄격해도 거리를 더 쓸 뿐이다. 다만
    #  끝내 도달 못 하면 timeout 시점의 꼬리도 같은 문턱으로 판정되므로,
    #  고수준이 자꾸 '사용 불가'로 버려지면 이 값을 되돌릴 것.)
    settle_slope: 0.015
    settle_sd: 0.05
    # 정상상태를 감지하면 RUN을 즉시 끝낸다. min_run_s 전에는 판정하지
    # 않는다 — 정지 상태의 평탄한 창이 정상상태로 오인되기 때문이다.
    # run_timeout_s는 이제 도달하지 못했을 때의 상한이다.
    # RUN 시작 1초 전부터 기록한다(음수 t). 추력 인가 직전의 정지 상태가
    # 과도구간 적합의 초기조건을 고정해준다.
    pre_run_s: 1.0
    # 이 배수만큼 긴 창에서도 정상이어야 끝낸다. 짧은 창 하나만 보면
    # 가속 중 살짝 내려갔다 다시 오르는 구간을 정상상태로 오인한다.
    settle_confirm_factor: 2.0
    min_run_s: 2.0
    run_timeout_s: 8.0

    # ── 기준 프레임 기하 (odom-상대) ──
    # 비전을 쓰지 않는다. prepare 시점 포즈가 원점이고 +X는 그때의 뱃머리
    # 방향이다. 따라서 아래 값은 전부 '출발점 기준 상대량'이다 — 절대 벽
    # 위치는 알 수 없으므로 기체를 벽 가까이 놓고 눈으로 여유를 확보할 것.
    use_pool_alignment: false
    axis_heading_rad: 0.0           # 주행축 = 출발 시 뱃머리
    # 첫 수준은 run_x_min + margin 에서 출발한다. 둘을 같은 크기로 두면
    # 출발점이 정확히 0(=prepare 자리)이 되고, margin 이 그대로 '뒤쪽 여유'가
    # 된다. 0.15로 두었더니 start_hold 30초 동안 밀려 하한을 밟았다 —
    # 0.35는 밀림 여유이자 왕복 시 뒤쪽 타행 여유다.
    #   전진: 0.00 → 주행 1.80 → 타행 0.62 = 2.42  ≤ run_x_max
    #   후진: 2.25 → 주행 1.80 → 타행 0.62 = -0.17 ≥ run_x_min
    run_x_min: -0.35
    run_x_max: 2.60
    run_start_margin_m: 0.35
    lane_y: 0.0                     # 차선 = 출발 시 진행선
    max_cross_track_m: 0.35
    # 바닥에서 시작한다. start 직후 yaw를 잡은 채 이만큼 상승해 호버링하고,
    # 그 자리에서 기준 프레임을 다시 잡은 뒤 주행을 시작한다. 상승 구간에는
    # z_min/z_max 대신 상승 회랑(-max_z_error ~ 목표+max_z_error)이 걸린다.
    # 부유 상태로 시작한다면 0.0으로 두면 종전과 같다.
    initial_ascent_m: 0.5
    ascend_tol_m: 0.08
    ascend_hold_s: 3.0
    ascend_timeout_s: 40.0
    target_z: 0.0                   # 재설정 후 호버 깊이를 유지한다
    max_z_error_m: 0.30
    # 상승 완료 후 재설정된 호버 깊이 기준. 수심 1.15m에서 바닥 0.5m 위에
    # 호버하므로 아래로 0.35(바닥까지 0.15) 위로 0.35(수면까지 0.30) 남는다.
    z_min: -0.35
    z_max: 0.35
    max_tilt_deg: 30.0

    # ── 단계 시간 ──
    start_hold_s: 30.0              # 이 구간에 테더를 놓는다. 깊이·방위가 잡히는지 볼 것
    # 단발 운용에서는 회차 사이 이동·재정렬 시간이 이 역할을 대신한다.
    # 다만 재순환이 가라앉을 만큼은 기다릴 것 — 최소 60초.
    inter_level_wait_s: 60.0
    coast_s: 3.0                    # 타행 기록: 추력 테이블과 무관한 Xuu 교차검증
    approach_timeout_s: 60.0
    settle_yaw_timeout_s: 20.0
    settle_yaw_tol_deg: 5.0
    settle_yaw_hold_s: 1.5
    turnaround_timeout_s: 30.0

    # ── 게인 (Z-up/FLU wrench, model_based_controller와 같은 규약) ──
    depth_kp: 60.0
    depth_ki: 8.0
    depth_kd: 20.0
    heave_limit_n: 60.0
    sway_kp: 25.0
    sway_kd: 12.0
    sway_limit_n: 12.0              # 낮게 둔다 — 차선 유지가 목적이지 기동이 아니다
    approach_surge_kp: 20.0
    approach_surge_limit_n: 15.0
    att_kp: 8.0
    att_ki: 1.0
    att_kd: 3.0
    moment_limit_nm: 12.0
    minimum_active_pwm: 0.10        # T200 deadband 0.075 위로 들어올린다
    thruster_force_activation: 0.25

    # ── 기타 ──
    localization_max_age_s: 1.0
    odometry_max_age_s: 0.5
    localization_min_samples: 20    # 이 모드에서는 쓰이지 않는다 (정렬 서비스 미호출)
    # 틸트 확인이 기존 표본을 전부 버리므로 prepare는 재수집을 기다린다.
    # 마커 포즈가 6Hz 안팎이라 20표본에 3~4초. 기체가 흔들리면 더 걸린다.
    alignment_sample_timeout_s: 30.0
    service_timeout_s: 15.0
    output_path: ""                 # 비우면 $BROV_DATA_DIR/drag_test.json
    send_pwm: true
