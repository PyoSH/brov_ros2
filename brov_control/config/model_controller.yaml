brov_model_based_controller:
  ros__parameters:
    # Field-tested depth-hold baseline. Keep integral action disabled until
    # anti-windup and in-water tuning have been explicitly verified.
    vehicle_config: ""
    linear_kp: [25.0, 25.0, 100.0]
    linear_ki: [0.0, 0.0, 0.0]
    attitude_kp: [3.0, 3.0, 3.0]
    attitude_ki: [0.0, 0.0, 0.0]
    angular_kd: [1.5, 1.5, 1.0]
    force_limit: [15.0, 15.0, 15.0]
    torque_limit: [3.0, 3.0, 3.0]
    minimum_active_pwm: 0.10
    thruster_force_activation: 0.25
    observation_timeout_s: 0.25

