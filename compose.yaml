services:
  brov:
    build:
      context: .
      dockerfile: Dockerfile
    image: brov-ros2-humble:arm64
    platform: linux/arm64
    container_name: brov-ros2-dev
    network_mode: host
    cap_add:
      - NET_ADMIN
    init: true
    stdin_open: true
    tty: true
    working_dir: /workspace/brov_ros2
    command: ["sleep", "infinity"]
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      ROS_LOCALHOST_ONLY: "0"
      BROV_DATA_DIR: /workspace/brov_ros2/runtime
      BROV_POLICY_PATH: /workspace/brov_ros2/artifacts/policies/demo_policy/policy.pt
      DISPLAY: host.docker.internal:0
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
    volumes:
      - .:/workspace/brov_ros2
      - brov-pip-cache:/root/.cache/pip
    stop_grace_period: 10s

volumes:
  brov-pip-cache:
