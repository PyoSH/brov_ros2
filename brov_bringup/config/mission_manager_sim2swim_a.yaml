brov_mission_manager:
  ros__parameters:
    # P0->P1 is a one-shot level takeoff.  P1<->P2 then loops with LOS alignment.
    contract_version: brov_pool_position_mission_v1
    pool_frame: pool
    odom_frame: odom
    base_frame: base_link
    aligned_odometry_topic: /brov/localization/odometry_pool_with_alignment

    orientation_support_enabled: false
    identity_orientation_tolerance: 0.001

    # Authored waypoint centre/segment bounds only; the finite measured start
    # may be just outside (for example, on the floor).  Its entry to waypoint 0
    # remains bounded by max_first_point_distance_m.  This is not a
    # swept-volume/runtime geofence.
    pool_safe_min_xyz: [0.35, 0.30, 0.20]
    pool_safe_max_xyz: [3.65, 1.40, 0.90]
    max_first_point_distance_m: 0.30
    min_segment_length_m: 0.05
    # 2026-09-03 사용자 결정: case_a 정본은 2.0 m. (9-01 실험 커밋이 2.20 으로
    # 올렸으나 a2 프로파일·계약 시험과 어긋나 있었다.)
    max_segment_length_m: 2.0
    min_waypoints: 3
    max_waypoints: 3

    localization_max_age_s: 1.0
    odometry_max_age_s: 0.5

    cruise_speed: 0.50
    lookahead_dist: 0.40
    reach_threshold: 0.15
    # 같은 실험 커밋의 산물(0.60→1.00) — 계약 시험이 단언하는 0.60 으로 복원.
    max_cruise_speed: 0.60
    max_lookahead_dist: 1.00
    max_reach_threshold: 0.50
    heading_mode: takeoff_then_align
    loop: true
    allowed_heading_modes: [takeoff_then_align]
