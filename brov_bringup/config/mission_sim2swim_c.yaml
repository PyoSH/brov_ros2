brov_obs_node:
  ros__parameters:
    # Sim2Swim real trial (c): 0.4 m square with a new random attitude per waypoint.
    waypoints: "0,0,0;0.4,0,0;0.4,0.4,0;0,0.4,0"
    waypoint_frame: "start_heading"
    heading_mode: "random_at_waypoint"
    loop: true

    # Tighter, slower settings for the small tank square.
    cruise_speed: 0.05
    lookahead_dist: 0.15
    reach_threshold: 0.08
    depth_hold_kp: 0.8
    depth_speed_limit: 0.05
    terminal_hold_kp: 0.5
    terminal_speed_limit: 0.05

    # Input validation only: these bounds do not monitor the measured vehicle pose.
    waypoint_bounds_enabled: true
    waypoint_min_xyz: [0.0, 0.0, 0.0]
    waypoint_max_xyz: [0.4, 0.4, 0.0]
