brov_obs_node:
  ros__parameters:
    # Case-C: Sim2Swim Trial(c) analog for the Gazebo MK2 pipeline -- 5 m
    # square, new random attitude sampled at each corner. Mirrors Isaac's
    # test_policy.py --test square_random_attitude scale exactly (5 m side,
    # 0.5 m/s), not the small real-pool mission_sim2swim_c.yaml (0.4 m,
    # 0.05 m/s) -- deploy_v3/v4/v5 were curriculum-trained at the 2 m/5 m,
    # 0.5 m/s Gazebo Case-A/Isaac scale, not the pool scale.
    #
    # random_at_waypoint with no random_attitude_config (brov_mission_manager
    # not involved here, same as Case-A's direct brov_obs_node params)
    # advances purely on position and samples a fresh on-the-fly random
    # attitude on arrival -- no explicit takeoff leg needed, LOSGuidance's
    # normal 3D pursuit handles the initial diagonal approach in one motion
    # (same as Isaac's square_random_attitude, which has no takeoff prefix
    # either).
    waypoints: "0,0,0.20;5.0,0,0.20;5.0,5.0,0.20;0,5.0,0.20"
    waypoint_frame: "start_heading"
    heading_mode: "random_at_waypoint"
    loop: true

    cruise_speed: 0.50
    lookahead_dist: 0.40
    reach_threshold: 0.15
    depth_hold_kp: 0.8
    depth_speed_limit: 0.05
    terminal_hold_kp: 0.5
    terminal_speed_limit: 0.05

    waypoint_bounds_enabled: true
    waypoint_min_xyz: [0.0, 0.0, 0.0]
    waypoint_max_xyz: [5.0, 5.0, 0.20]
