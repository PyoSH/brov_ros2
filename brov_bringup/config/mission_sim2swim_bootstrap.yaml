brov_obs_node:
  ros__parameters:
    # Benign startup-only guidance.  The resolved pool mission replaces these
    # settings atomically at PREPARE, and the control gate cannot open before
    # that replacement succeeds.
    waypoints: "0,0,0;0.01,0,0"
    waypoint_frame: start_heading
    heading_mode: straight
    cruise_speed: 0.01
    loop: false
    reach_threshold: 0.005
    lookahead_dist: 0.05
    depth_hold_kp: 0.8
    depth_speed_limit: 0.01
    terminal_hold_kp: 0.5
    terminal_speed_limit: 0.01
    waypoint_bounds_enabled: true
    waypoint_min_xyz: [0.0, 0.0, 0.0]
    waypoint_max_xyz: [0.01, 0.0, 0.0]
