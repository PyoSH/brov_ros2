brov_obs_node:
  ros__parameters:
    # Complete copy of brov_base/config/safety.yaml plus the fail-closed Case-C
    # random-attitude/PWM gateway envelope.  The launch selects this file
    # internally so a general safety_config argument cannot bypass it.
    att_max_age_s: 0.2
    pos_max_age_s: 0.5
    ekf_max_age_s: 0.5
    max_integration_dt_s: 0.3
    quat_norm_tolerance: 0.1
    telemetry_source_skew_max_ms: 150
    heartbeat_max_age_s: 2.0
    required_custom_mode: 19
    required_ekf_flags: 47
    integral_vel_limit: 5.0
    integral_att_limit: 5.0

    odom_jump_translation_m: 0.50
    odom_jump_rotation_deg: 45.0
    odom_jump_max_dt_s: 0.50

    arm_to_start_timeout_s: 8.0
    first_pwm_timeout_s: 8.0
    pwm_command_timeout_s: 0.25

    max_prepare_position_drift_m: 0.10
    max_prepare_attitude_drift_deg: 10.0
    max_resolved_waypoints: 50
    max_resolved_segment_length_m: 4.0
    max_resolved_cruise_speed: 0.30
    max_resolved_lookahead_dist: 1.0
    max_resolved_reach_threshold: 0.50

    # Consumer-side bounds on immutable v2 mission metadata.
    max_random_attitude_slew_rate_rad_s: 0.50
    max_random_attitude_tolerance_rad: 0.35
    max_random_angular_speed_tolerance_rad_s: 0.20
    min_random_attitude_dwell_s: 0.50
    max_random_mission_duration_s: 180.0
    max_random_mission_laps: 1

    # Independent of the policy-node limiter: malformed or excessive PWM is
    # rejected again at the sole MAVLink owner.
    max_pwm_abs: 0.35
    max_pwm_delta_per_s: 0.50
    pwm_rate_first_command_dt_s: 0.04
